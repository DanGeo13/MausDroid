# Checks that the release secrets are present and correct, without printing them
# and without building or publishing anything. Safe to run any time.
name: check-secrets
on:
  workflow_dispatch:
  push:
    branches: [ci/check-secrets]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check each secret
        env:
          PEM: ${{ secrets.MAUSDROID_UPDATE_KEY_PEM }}
          KS_B64: ${{ secrets.MAUSDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MAUSDROID_KEYSTORE_PASSWORD }}
        run: |
          ok=1
          say() { echo "$1"; }
          if [ -z "$PEM" ]; then say "MISSING: MAUSDROID_UPDATE_KEY_PEM"; ok=0
          else
            got=$(node -e 'const c=require("crypto");process.stdout.write(c.createPublicKey(process.env.PEM).export({format:"der",type:"spki"}).toString("base64"))' 2>/dev/null || echo bad)
            if [ "$got" = "$(tr -d '\n\r ' < updates-public-key.txt)" ]; then say "OK: MAUSDROID_UPDATE_KEY_PEM matches the key installed apps trust"
            else say "WRONG: MAUSDROID_UPDATE_KEY_PEM is present but is not the right key (check it was pasted whole, with BEGIN/END lines)"; ok=0; fi
          fi
          if [ -z "$KS_B64" ]; then say "MISSING: MAUSDROID_KEYSTORE_B64"; ok=0
          elif ! printf '%s' "$KS_B64" | base64 -d > /tmp/ks.jks 2>/dev/null; then say "WRONG: MAUSDROID_KEYSTORE_B64 is present but isn't valid base64 (pasted incompletely?)"; ok=0
          else say "OK: MAUSDROID_KEYSTORE_B64 decodes ($(wc -c < /tmp/ks.jks) bytes; expected 4238)"; fi
          if [ -z "$KS_PASS" ]; then say "MISSING: MAUSDROID_KEYSTORE_PASSWORD"; ok=0
          elif [ -s /tmp/ks.jks ]; then
            if keytool -list -keystore /tmp/ks.jks -storepass "$KS_PASS" -alias mausdroid >/dev/null 2>&1; then say "OK: MAUSDROID_KEYSTORE_PASSWORD opens the keystore and the 'mausdroid' key is inside"
            else say "WRONG: MAUSDROID_KEYSTORE_PASSWORD doesn't open the keystore (or the keystore text is incomplete)"; ok=0; fi
          else say "PRESENT: MAUSDROID_KEYSTORE_PASSWORD (can't test it until the keystore secret is fixed)"; fi
          rm -f /tmp/ks.jks
          [ $ok = 1 ] && echo "ALL GOOD: releases can be signed." || { echo "Something needs fixing (see above)."; exit 1; }
