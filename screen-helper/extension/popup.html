<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f3f3f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#eee; --muted:#999; --card:#2c2c2e; } }
  body { margin:0; width:280px; padding:14px; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  #status { background:var(--card); border-radius:10px; padding:10px; }
</style>
</head>
<body>
  <div id="status">Taking a screenshot…</div>
  <script src="prompt.js"></script>
  <script src="popup.js"></script>
</body>
</html>
