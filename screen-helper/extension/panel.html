<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Screen Helper</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f3f3f5; --accent:#10a37f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#eee; --muted:#999; --card:#2c2c2e; } }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header, form { display:flex; gap:8px; padding:12px; }
  button { border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; background:var(--card); color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; }
  input { flex:1; min-width:0; border-radius:8px; border:1px solid var(--card); padding:8px; font:inherit; background:var(--bg); color:var(--fg); }
  .opts { display:flex; gap:8px; padding:0 12px 8px; color:var(--muted); font-size:12px; }
  .opts label { flex:1; display:flex; flex-direction:column; gap:2px; }
  select { border-radius:8px; border:1px solid var(--card); padding:6px; font:inherit; font-size:13px; background:var(--bg); color:var(--fg); }
  #log { flex:1; overflow-y:auto; padding:0 12px; }
  .q { color:var(--muted); margin-top:12px; }
  .a { background:var(--card); border-radius:10px; padding:10px; margin-top:6px; white-space:pre-wrap; }
</style>
</head>
<body>
  <header>
    <button class="primary" id="look">Look at this tab</button>
    <button id="account">Sign in with ChatGPT</button>
  </header>
  <div class="opts">
    <label>Model <select id="model"></select></label>
    <label>Effort <select id="effort"><option value="">Default</option></select></label>
  </div>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask a follow-up…" autocomplete="off">
    <button>Ask</button>
  </form>
  <script src="auth.js"></script>
  <script src="models.js"></script>
  <script src="prompt.js"></script>
  <script src="panel.js"></script>
</body>
</html>
